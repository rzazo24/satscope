<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* Layout: panel de una columna — acción de la semana arriba, indicadores, histórico de puntuación, ajustes plegados */
:root{
  --bg:#f6f5f1;--panel:#ffffff;--fg:#1d1c19;--muted:#6d6a60;--line:#e2dfd5;
  --accent:#d9820b;--buy:#2f7d4f;--hold:#8a8577;--sell:#b23b2e;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--panel:#1f1d17;--fg:#ece8dc;--muted:#9d998c;--line:#34312a;--accent:#f0a030;--buy:#5cbf84;--hold:#a19c8e;--sell:#e2705f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15140f;--panel:#1f1d17;--fg:#ece8dc;--muted:#9d998c;--line:#34312a;--accent:#f0a030;--buy:#5cbf84;--hold:#a19c8e;--sell:#e2705f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:1.3rem;margin:0}
h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.src{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.hero>div{min-width:0}
.score{font-family:var(--mono);font-size:4rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;color:var(--muted);font-weight:400}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:.85rem;color:#fff}
.action{font-size:1.15rem;font-weight:600;margin-top:6px}
.sub{color:var(--muted);font-size:.85rem}
.bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--buy),var(--hold) 50%,var(--sell));margin:18px 0 4px}
.bar i{position:absolute;top:-5px;width:4px;height:20px;background:var(--fg);border-radius:2px;transform:translateX(-2px)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.ind{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:4px}
.ind .n{font-size:.78rem;color:var(--muted)}
.ind .v{font-family:var(--mono);font-size:1.05rem;font-weight:600}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mini b{display:block;height:100%;background:var(--accent)}
canvas{width:100%;height:180px;display:block}
details summary{cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
label{display:grid;gap:4px;font-size:.8rem}
input{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:.75rem;color:var(--muted)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:2px}
.seg button{font:inherit;font-size:.75rem;border:0;background:none;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg[hidden]{display:none}
.update{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;background:var(--fg);color:var(--bg);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:10;font-size:.9rem}
.update[hidden]{display:none}
.btn{font:inherit;font-size:.85rem;font-weight:600;padding:6px 12px;min-height:34px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:focus-visible,.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{font:inherit;font-size:.85rem;border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px}
.done{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
.done:empty{display:none}
.done .ok{color:var(--buy);font-weight:600}
.done form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;width:100%}
.done label{flex:1 1 120px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.stat .n{font-size:.75rem;color:var(--muted)}
.stat .v{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.ops{max-height:320px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:6px}
.ops .tbl{font-size:.8rem}
.ops .tbl th,.ops .tbl td{padding:6px 5px}
.ops .tbl td:first-child{font-family:var(--mono);color:var(--fg)}
.ops .tbl td,.ops .tbl th{white-space:nowrap}
.ops .tbl th:nth-child(2),.ops .tbl td:nth-child(2){text-align:left;font-family:var(--sans)}
.ops .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 4px;min-height:28px;min-width:24px}
.ops .del:focus-visible{outline:2px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.add{margin-top:12px}
.add .grid2{align-items:end}
.stats[hidden],.ops[hidden],.note[hidden]{display:none}
.bt-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bt-head h2{margin:0}
.bt-head label{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
select{font:inherit;font-size:.85rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--muted);font-weight:400}
.tbl td{font-family:var(--mono)}
.tbl thead th{font-size:.75rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin:12px 0 4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.update span{flex:1;min-width:0}
.update button{font:inherit;font-weight:600;border:0;border-radius:6px;cursor:pointer;min-height:36px}
.update .go{background:var(--accent);color:#1d1c19;padding:6px 14px}
.update .x{background:none;color:inherit;opacity:.7;padding:6px 10px;font-size:1.1rem;line-height:1}
.update button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.hero{grid-template-columns:1fr}.score{font-size:3.2rem}}
</style>
<!-- Vercel Web Analytics (sin cookies) -->
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
// Aplica el tema guardado antes de pintar para evitar el parpadeo
try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
</head>
<body>
<div class="update" id="update" role="status" hidden>
  <span data-i18n="updMsg"></span>
  <button type="button" class="go" id="updGo" data-i18n="updGo"></button>
  <button type="button" class="x" id="updX" data-i18n-aria="updLater">×</button>
</div>
<div class="wrap">
  <div class="top">
    <div><h1>SatScope</h1><span class="src" id="src">…</span></div>
    <div class="ctrls">
      <div class="seg" id="installSeg" hidden><button type="button" id="installBtn" data-i18n="install"></button></div>
      <div class="seg" role="group" id="langSeg" aria-label="Idioma / Language">
        <button type="button" data-lang="es" lang="es">ES</button><button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <div class="seg" role="group" id="themeSeg" data-i18n-aria="theme">
        <button type="button" data-theme-opt="auto" data-i18n="tAuto"></button><button type="button" data-theme-opt="light" data-i18n="tLight"></button><button type="button" data-theme-opt="dark" data-i18n="tDark"></button>
      </div>
    </div>
  </div>

  <section>
    <div class="hero">
      <div class="score" id="score">–<small>/100</small></div>
      <div>
        <span class="pill" id="pill">–</span>
        <div class="action" id="action" data-i18n="calc"></div>
        <div class="sub" id="hint"></div>
        <div class="done" id="done"></div>
        <div class="sub" id="price"></div>
      </div>
    </div>
    <div class="bar"><i id="mark" style="left:50%"></i></div>
    <div class="ticks"><span data-i18n="tick0"></span><span>20</span><span>40</span><span>60</span><span>80</span><span data-i18n="tick100"></span></div>
  </section>

  <section>
    <h2 data-i18n="inds"></h2>
    <div class="inds" id="inds"></div>
  </section>

  <section>
    <h2 data-i18n="hist"></h2>
    <canvas id="chart"></canvas>
    <p class="note" data-i18n="histNote"></p>
  </section>

  <section>
    <h2 data-i18n="pf"></h2>
    <div class="stats" id="pfStats"></div>
    <p class="note" id="pfEmpty" data-i18n="pfEmpty"></p>
    <div class="ops" id="pfOps"></div>
    <p class="note" id="pfStar" data-i18n="star" hidden></p>
    <details class="add">
      <summary data-i18n="addOp"></summary>
      <form id="addForm" class="grid2">
        <label><span data-i18n="fType"></span><select id="mType"><option value="buy" data-i18n="tyBuy"></option><option value="sell" data-i18n="tySell"></option><option value="res" data-i18n="tyRes"></option></select></label>
        <label><span data-i18n="fDate"></span><input type="date" id="mDate" required></label>
        <label><span data-i18n="fUsd"></span><input type="number" id="mUsd" step="any" required></label>
        <label><span data-i18n="fBtc"></span><input type="number" id="mBtc" step="any" min="0"></label>
        <label><span data-i18n="fRes"></span><input type="number" id="mRes" step="any" min="0" value="0"></label>
        <button type="submit" class="btn pri" data-i18n="add"></button>
      </form>
      <p class="note" data-i18n="addNote"></p>
    </details>
    <div class="row">
      <button type="button" class="btn" id="expBtn" data-i18n="exp"></button>
      <button type="button" class="btn" id="impBtn" data-i18n="imp"></button>
      <input type="file" id="impFile" accept=".csv,text/csv" hidden>
    </div>
    <p class="note" id="pfMsg" role="status"></p>
    <p class="note" data-i18n="pfNote"></p>
  </section>

  <section>
    <div class="bt-head"><h2 data-i18n="bt"></h2><label><span data-i18n="btFrom"></span><select id="btFrom"></select></label></div>
    <table class="tbl" id="btTbl"></table>
    <div class="legend"><span><i style="background:var(--accent)"></i><span data-i18n="btDyn"></span></span><span><i style="background:var(--muted)"></i><span data-i18n="btDca"></span></span></div>
    <canvas id="btChart"></canvas>
    <p class="note" data-i18n="btNote"></p>
  </section>

  <section>
    <details>
      <summary data-i18n="settings"></summary>
      <div class="grid2">
        <label><span data-i18n="lBase"></span><input type="number" id="base" value="10" min="0" step="0.5"></label>
        <label><span data-i18n="lWF"></span><input type="number" id="wF" value="30"></label>
        <label><span data-i18n="lWD"></span><input type="number" id="wD" value="40"></label>
        <label><span data-i18n="lWW"></span><input type="number" id="wW" value="15"></label>
        <label><span data-i18n="lWR"></span><input type="number" id="wR" value="15"></label>
        <label>Mult. 0–20<input type="number" id="m0" value="5" step="0.25"></label>
        <label>Mult. 20–40<input type="number" id="m1" value="1" step="0.25"></label>
        <label>Mult. 40–60<input type="number" id="m2" value="0" step="0.25"></label>
        <label>Mult. 60–80<input type="number" id="m3" value="0" step="0.25"></label>
        <label>Mult. 80–100<input type="number" id="m4" value="0" step="0.25"></label>
        <label><span data-i18n="lSellAt"></span><input type="number" id="sellAt" value="80"></label>
        <label><span data-i18n="lSellPct"></span><input type="number" id="sellPct" value="2" step="0.5"></label>
        <label><span data-i18n="lReuse"></span><input type="number" id="reuseBelow" value="20"></label>
      </div>
      <p class="note" style="margin-top:10px" data-i18n="saved"></p>
    </details>
  </section>
  <p class="note" data-i18n="disclaimer"></p>
</div>

<script>
const $=id=>document.getElementById(id);
const IDS=['base','wF','wD','wW','wR','m0','m1','m2','m3','m4','sellAt','sellPct','reuseBelow'];
// Ajustes: solo se guarda lo que el usuario cambia, así los valores por defecto nuevos llegan a todos
const DEF=Object.fromEntries(IDS.map(k=>[k,+$(k).value]));
try{
  // Migración: la versión anterior guardaba todos los valores en 'dcaCfg'; se conserva solo lo que difería de sus valores por defecto
  const old=localStorage.getItem('dcaCfg');
  if(old!=null){const OLD={base:5,wF:30,wD:40,wW:15,wR:15,m0:5,m1:1,m2:0,m3:0,m4:0,sellAt:75,sellPct:5},o=JSON.parse(old),keep={};
    for(const k of IDS)if(o[k]!=null&&+o[k]!==OLD[k])keep[k]=+o[k];
    localStorage.setItem('cfg',JSON.stringify(keep));localStorage.removeItem('dcaCfg')}
  const sv=JSON.parse(localStorage.getItem('cfg')||'{}');for(const k of IDS)if(sv[k]!=null)$(k).value=sv[k];
  // La reserva ya no se escribe a mano: si había una, pasa al registro como ajuste de reserva
  if(sv.reserve>0&&!localStorage.getItem('ledger')){const d=new Date();localStorage.setItem('ledger',JSON.stringify([{id:'m'+Date.now(),d:new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),type:'res',usd:+sv.reserve,btc:0,res:0}]))}
}catch(e){}
const cfg=()=>Object.fromEntries(IDS.map(k=>[k,+$(k).value]));
const clamp=v=>Math.max(0,Math.min(100,v));

// Idioma
const I18N={
  es:{loc:'es-ES',desc:'Panel de DCA dinámico para Bitcoin',loading:'Cargando…',live:(s,f)=>`Datos en directo · ${s}${f==='live'?' + alternative.me':f==='snap'?' · Fear & Greed no disponible: se usan los valores guardados':' · Fear & Greed no disponible: la puntuación se calcula sin él'}`,snap:d=>`Sin conexión a las APIs · datos guardados del ${d}`,
    theme:'Tema',install:'Instalar app',updMsg:'Hay una nueva versión de SatScope.',updGo:'Actualizar',updLater:'Más tarde',tAuto:'Auto',tLight:'Claro',tDark:'Oscuro',calc:'Calculando la acción de esta semana…',tick0:'0 miedo',tick100:'100 euforia',
    inds:'Indicadores',hist:'Puntuación de las últimas 104 semanas',histNote:'Línea discontinua: umbral de venta. Zona verde: tramos con compra.',
    settings:'Ajustes de la estrategia',lBase:'Aportación base ($)',lWF:'Peso Fear & Greed',lWD:'Peso caída desde máximo',lWW:'Peso MA200 semanas',lWR:'Peso RSI semanal',
    lSellAt:'Vender desde puntuación',lSellPct:'% de BTC a vender',saved:'Los ajustes se guardan en este navegador.',
    disclaimer:'Herramienta de análisis basada en datos históricos. No es asesoramiento financiero.',
    sell:'Vender',buy:'Comprar',hold:'Esperar',
    aSell:p=>`Vende el ${p} % de tu BTC esta semana`,aBuy:(a,m)=>`Compra ${a} $ esta semana (×${m})`,aHold:'Esta semana no toca comprar ni vender',
    price:p=>`BTC ahora a ${p} $`,wk:(d,n)=>`Señal con el cierre semanal del ${d} · la siguiente, tras el cierre del ${n}`,wkSnap:d=>`Señal con los datos guardados del ${d}`,
    bt:'Backtest',btFrom:'Desde',btDyn:'Tu estrategia',btDca:'DCA fijo',rInv:'Invertido',rBtc:'BTC acumulado',rSold:'Reserva en efectivo',rVal:'Valor hoy',rRet:'Rentabilidad',rAvg:'Precio medio de compra',
    btNote:'Simulación semanal con los ajustes de abajo. Lo vendido se guarda como reserva y se usa para comprar el doble cuando la puntuación baja del umbral de reserva. DCA fijo: la aportación base todas las semanas. Sin comisiones. Valor hoy = BTC × último cierre semanal + reserva sin usar.',
    lReuse:'Usar reserva por debajo de',
    aSellBtc:(b,u)=>`Vende ${b} BTC esta semana (≈ ${u})`,
    markDone:'Marcar como hecha',save:'Guardar',cancel:'Cancelar',undo:'Deshacer',
    fUsdBuy:'Importe pagado ($)',fBtcBuy:'BTC recibido',fBtcSell:'BTC vendido',fUsdSell:'Recibido ($)',

    addOp:'Añadir operación a mano',fType:'Tipo',fDate:'Fecha',fUsd:'Importe ($)',fBtc:'BTC',fRes:'De la reserva ($)',add:'Añadir',

    theme:'Theme',install:'Install app',updMsg:'A new version of SatScope is available.',updGo:'Update',updLater:'Later',tAuto:'Auto',tLight:'Light',tDark:'Dark',calc:'Working out this week’s action…',tick0:'0 fear',tick100:'100 greed',
    inds:'Indicators',hist:'Score over the last 104 weeks',histNote:'Dashed line: sell threshold. Green zone: bands that buy.',
    settings:'Strategy settings',lBase:'Base amount ($)',lWF:'Fear & Greed weight',lWD:'Drawdown from ATH weight',lWW:'200-week MA weight',lWR:'Weekly RSI weight',

function applyLang(){
  const t=T();document.documentElement.lang=LANG;
  document.querySelector('meta[name="description"]').content=t.desc;

// PWA: service worker y botón de instalar
// Aviso de nueva versión: cuando un service worker nuevo termina de descargarse, se ofrece recargar.
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',async()=>{
  let reg;try{reg=await navigator.serviceWorker.register('/sw.js')}catch(e){return}
  const offer=w=>{if(!w||!navigator.serviceWorker.controller)return;$('update').hidden=false;$('updGo').onclick=()=>{$('updGo').disabled=true;w.postMessage('SKIP_WAITING')}};
  if(reg.waiting)offer(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')offer(w)})});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload()}});
  // Con la app abierta mucho tiempo: busca versiones nuevas cada hora y al volver a ella.
  setInterval(()=>reg.update().catch(()=>{}),36e5);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
});
$('updX').addEventListener('click',()=>$('update').hidden=true);

// RSI de Wilder (14 periodos), el mismo que TradingView: las medias de subidas y bajadas
// se suavizan como (anterior × 13 + actual) / 14
function wilder(p,n=14){
  const out=p.map(()=>null);if(p.length<=n)return out;
  let g=0,l=0;for(let i=1;i<=n;i++){const d=p[i]-p[i-1];if(d>0)g+=d;else l-=d}
  g/=n;l/=n;const rsi=()=>l===0?100:100-100/(1+g/l);out[n]=rsi();
  for(let i=n+1;i<p.length;i++){const d=p[i]-p[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;out[i]=rsi()}
  return out;
}

function parts(r){return{f:r.fng,d:clamp((1-r.dd/80)*100),w:clamp(Math.log(r.w200)/Math.log(5)*100),r:r.rsi}}

const getJSON=async u=>{const r=await fetch(u,{signal:AbortSignal.timeout(10000)});if(!r.ok)throw new Error(u+' '+r.status);return r.json()};
// Cada fuente devuelve velas {t: apertura en ms, c: cierre, e: hora de cierre en ms}, de la más antigua a la más reciente
async function binance(){
  const k=[];let end=Date.now();
  for(let n=0;n<3;n++){
    const a=await getJSON(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000&endTime=${end}`);if(!a.length)break;
    k.unshift(...a.map(x=>({t:x[0],c:+x[4],e:x[6]})));end=a[0][0]-1;
  }
  return k;
}
async function bitstamp(){
  const k=[];let end=Math.floor(Date.now()/1000);
  for(let n=0;n<3;n++){
    const a=(await getJSON(`https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=86400&limit=1000&end=${end}`)).data.ohlc;if(!a.length)break;
    k.unshift(...a.map(x=>({t:+x.timestamp*1000,c:+x.close,e:+x.timestamp*1000+864e5-1})));end=+a[0].timestamp-1;
  }
  return k;
}
const SOURCES=[['Binance',binance],['Bitstamp',bitstamp]];
async function live(){
  let k=null,src=null;
  for(const[name,f]of SOURCES){try{const a=await f();if(a.length>=1600){k=a;src=name;break}}catch(e){}}
  if(!k)throw new Error('sin precios');
  const now=k.at(-1).c;
  while(k.length&&k.at(-1).e>Date.now())k.pop(); // descarta la vela de hoy, aún abierta
  // Si Fear & Greed falla, se siguen usando los precios en directo y Fear & Greed sale de la instantánea
  // (el valor semanal guardado más cercano, a 3 días como mucho). Si no hay, la puntuación se calcula sin él.
  let fm=null,fngSrc='live';
  try{const f=await getJSON('https://api.alternative.me/fng/?limit=0');fm=new Map(f.data.map(x=>[new Date(+x.timestamp*1000).toISOString().slice(0,10),+x.value]))}catch(e){}
  if(!fm){
    fngSrc='snap';const sf=new Map(SNAP.filter(r=>r.fng!=null).map(r=>[r.t,r.fng]));
    const near=t=>{for(const k of[0,1,-1,2,-2,3,-3]){const v=sf.get(new Date(Date.parse(t)+k*864e5).toISOString().slice(0,10));if(v!=null)return v}return null};
    fm={get:near};
  }
  // Cierres de los domingos, con el máximo histórico hasta ese día
  const W=[];let m=0,last=null;
  for(const x of k){
    if(last!=null&&x.t<=last)continue;last=x.t; // por si una página repite velas
    m=Math.max(m,x.c);if(new Date(x.t).getUTCDay()===0)W.push({t:new Date(x.t).toISOString().slice(0,10),p:x.c,ath:m});
  }
  const rs=wilder(W.map(w=>w.p));
  const rows=[];let sum=0;
  for(let i=0;i<W.length;i++){
    sum+=W[i].p;if(i>=200)sum-=W[i-200].p;if(i<199)continue; // MA de 200 cierres semanales
    rows.push({t:W[i].t,p:W[i].p,w200:W[i].p/(sum/200),rsi:rs[i],fng:fm.get(W[i].t)??null,dd:(1-W[i].p/W[i].ath)*100});
  }
  if(rows.length<10)throw new Error('pocos datos');
  if(fngSrc==='snap'&&rows.at(-1).fng==null)fngSrc='none';
  return {rows,now,src,fng:fngSrc};
}

// Backtest semanal: tu estrategia frente a un DCA fijo con la aportación base
function backtest(rows,c){
  let inv=0,spent=0,btc=0,bought=0,cash=0,dInv=0,dBtc=0;const vals=[];
  for(const r of rows){
    const s=score(r,c);if(s==null)continue;
    if(s>=c.sellAt){const q=btc*c.sellPct/100;btc-=q;cash+=q*r.p}
    else{const m=c['m'+Math.min(4,Math.floor(s/20))];if(m>0){
      let a=c.base*m;inv+=a;
      if(s<c.reuseBelow&&cash>0){const x=Math.min(cash,a);cash-=x;a+=x} // la reserva de ventas duplica la compra en miedo extremo
      spent+=a;btc+=a/r.p;bought+=a/r.p}}
    dInv+=c.base;dBtc+=c.base/r.p;
    vals.push([btc*r.p+cash,dBtc*r.p]);
  }
  const last=rows.at(-1).p,S={inv,btc,cash,val:btc*last+cash,avg:bought?spent/bought:null},D={inv:dInv,btc:dBtc,cash:0,val:dBtc*last,avg:dBtc?dInv/dBtc:null};
  for(const o of[S,D])o.ret=o.inv?(o.val-o.inv)/o.inv*100:0;
  return {S,D,vals};
}

});
function renderPf(c,LS){
  const t=T(),has=LEDGER.length>0;
  $('pfEmpty').hidden=has;$('pfStar').hidden=!LEDGER.some(o=>o.res>0);$('pfOps').hidden=!has;$('pfStats').hidden=!has;$('expBtn').disabled=!has;
  if(!has)return;
  const val=LS.btc*NOW+LS.reserve,ret=LS.invested>0?(val-LS.invested)/LS.invested*100:null;
  const S=[[t.sBtc,fmt(LS.btc,8)],[t.sVal,usd(val,2)],[t.sInv,usd(LS.invested,2)],[t.sRet,ret==null?'–':pct(ret)],[t.sAvg,LS.avg?usd(LS.avg):'–'],[t.sRes,usd(LS.reserve,2)],[t.sSkip,fmt(skipped(c))]];
  $('pfStats').innerHTML=S.map(([n,v])=>`<div class="stat"><span class="n">${n}</span><span class="v">${v}</span></div>`).join('');
  const ty={buy:t.tyBuy,sell:t.tySell,res:t.tyRes};
  $('pfOps').innerHTML=`<table class="tbl"><thead><tr><th scope="col">${t.cDate}</th><th scope="col">${t.cType}</th><th scope="col">${t.cUsd}</th><th scope="col">${t.cBtc}</th><th scope="col"><span hidden>${t.del}</span></th></tr></thead><tbody>`+
    [...LEDGER].reverse().map(o=>`<tr><td>${new Date(o.d).toLocaleDateString(t.loc,{day:'2-digit',month:'2-digit',year:'2-digit',timeZone:'UTC'})}</td><td>${ty[o.type]}${o.res>0?' *':''}</td><td>${fmt(o.usd,2)}</td><td>${o.type==='res'?'–':fmt(o.btc,6)}</td><td><button type="button" class="del" data-del="${o.id}" aria-label="${t.del}">×</button></td></tr>`).join('')+'</tbody></table>';
}
$('pfOps').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b&&confirm(T().delQ)){LEDGER=LEDGER.filter(o=>o.id!==b.dataset.del);saveLedger()}});
$('mDate').value=today();
$('addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const o={id:newId(),d:$('mDate').value,type:$('mType').value,usd:+$('mUsd').value,btc:+$('mBtc').value||0,res:+$('mRes').value||0};
  if(o.type!=='buy')o.res=0;if(o.type==='res')o.btc=0;
  if(!okOp(o)||(o.type!=='res'&&!(o.usd>0&&o.btc>0))||(o.type==='res'&&!o.usd))return;
  o.res=Math.min(o.res,o.usd);
  if(o.type==='sell'&&o.btc>ledgerStats().btc+1e-9){$('pfMsg').textContent=T().tooMuch(fmt(ledgerStats().btc,8));return}
  $('pfMsg').textContent='';
  LEDGER.push(o);saveLedger();$('mUsd').value='';$('mBtc').value='';$('mRes').value=0;
});
// CSV: fecha,tipo,usd,btc,reserva_usada (tipo: buy | sell | res)
$('expBtn').addEventListener('click',()=>{
  const csv='date,type,usd,btc,from_reserve\n'+LEDGER.map(o=>[o.d,o.type,o.usd,o.btc,o.res].join(',')).join('\n')+'\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`satscope-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$('impBtn').addEventListener('click',()=>$('impFile').click());
$('impFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const lines=(await f.text()).trim().split(/\r?\n/);
    if(!/^date,type,usd,btc/.test(lines[0]))throw 0;
    const key=o=>[o.d,o.type,o.usd,o.btc,o.res].join('|'),have=new Set(LEDGER.map(key));let n=0;
    for(const l of lines.slice(1)){
      const [d,type,u,b,r]=l.split(',');const o={id:newId(),d,type,usd:+u,btc:+b||0,res:+r||0};
      if(!okOp(o))throw 0;if(!have.has(key(o))){LEDGER.push(o);have.add(key(o));n++}
    }
    saveLedger();$('pfMsg').textContent=T().impOk(n);
  }catch(_){$('pfMsg').textContent=T().impErr}
});
function renderBt(c){
  const t=T(),sel=$('btFrom');
  const years=[...new Set(HIST.map(r=>r.t.slice(0,4)))];
  if(sel.options.length!==years.length){
    let saved=null;try{saved=localStorage.getItem('btFrom')}catch(e){}
    sel.innerHTML=years.map(y=>`<option>${y}</option>`).join('');
    sel.value=years.includes(saved)?saved:years[0];
  }
  const rows=HIST.filter(r=>r.t>=sel.value+'-01-01');if(rows.length<2)return;
  const {S,D,vals}=backtest(rows,c);
  const row=(k,f)=>`<tr><th scope="row">${t[k]}</th><td>${f(S)}</td><td>${f(D)}</td></tr>`;
  $('btTbl').innerHTML=`<thead><tr><th></th><th scope="col">${t.btDyn}</th><th scope="col">${t.btDca}</th></tr></thead><tbody>`+
    row('rInv',o=>usd(o.inv))+row('rBtc',o=>fmt(o.btc,5))+row('rSold',o=>usd(o.cash))+row('rVal',o=>usd(o.val))+row('rRet',o=>pct(o.ret))+row('rAvg',o=>o.avg?usd(o.avg):'–')+'</tbody>';
  drawBt(vals,rows[0].t,rows.at(-1).t);
}
function drawBt(v,from,to){
  const cv=$('btChart'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
  const max=Math.max(...v.flat())*1.05||1,L=44,R=6,T=6,B=18,w=W-L-R,h=H-T-B,x=i=>L+i/(v.length-1)*w,y=val=>T+h-val/max*h;
  g.font='10px IBM Plex Mono, monospace';g.fillStyle=col('--muted');g.strokeStyle=col('--line');g.lineWidth=1;g.textAlign='right';
  for(const f of[0,.5,1]){const val=max*f/1.05;g.beginPath();g.moveTo(L,y(val));g.lineTo(L+w,y(val));g.stroke();g.fillText(val>=1000?fmt(val/1000,1)+'k':fmt(val),L-4,y(val)+3)}
  g.textAlign='left';g.fillText(from.slice(0,7),L,H-4);g.textAlign='right';g.fillText(to.slice(0,7),L+w,H-4);
  for(const[k,c,lw]of[[1,'--muted',1.5],[0,'--accent',2]]){g.strokeStyle=col(c);g.lineWidth=lw;g.beginPath();v.forEach((p,i)=>i?g.lineTo(x(i),y(p[k])):g.moveTo(x(i),y(p[k])));g.stroke()}
}
$('btFrom').addEventListener('change',()=>{try{localStorage.setItem('btFrom',$('btFrom').value)}catch(e){}render()});
function draw(s,c){
  const cv=$('chart'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
  const L=28,R=6,T=6,B=6,w=W-L-R,h=H-T-B,x=i=>L+i/(s.length-1)*w,y=v=>T+h-v/100*h;
  let buyTop=0;for(let k=0;k<5;k++)if(c['m'+k]>0)buyTop=(k+1)*20;
  g.globalAlpha=.12;g.fillStyle=col('--buy');g.fillRect(L,y(buyTop),w,y(0)-y(buyTop));g.globalAlpha=1;
  g.font='10px IBM Plex Mono, monospace';g.fillStyle=col('--muted');g.strokeStyle=col('--line');g.lineWidth=1;g.textAlign='right';
  for(const v of[0,50,100]){g.beginPath();g.moveTo(L,y(v));g.lineTo(L+w,y(v));g.stroke();g.fillText(v,L-4,y(v)+3)}
  g.setLineDash([4,4]);g.strokeStyle=col('--sell');g.beginPath();g.moveTo(L,y(c.sellAt));g.lineTo(L+w,y(c.sellAt));g.stroke();g.setLineDash([]);
  g.strokeStyle=col('--accent');g.lineWidth=2;g.beginPath();s.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.stroke();
  g.fillStyle=col('--accent');g.beginPath();g.arc(x(s.length-1),y(s.at(-1)),4,0,7);g.fill();
}
for(const k of IDS)$(k).addEventListener('input',render);
addEventListener('resize',render);
let savedTheme=null;try{savedTheme=localStorage.getItem('theme')}catch(e){}
applyTheme(savedTheme);applyLang();
(async()=>{
  try{const L=await live();ROWS=L.rows;NOW=L.now;SRC='live';LIVE={src:L.src,fng:L.fng};
    // Backtest: la instantánea cubre desde 2018 y los datos en directo, las semanas recientes
    HIST=[...SNAP.filter(r=>r.t<ROWS[0].t),...ROWS]}
  catch(e){ROWS=SNAP;HIST=SNAP;NOW=SNAP.at(-1).p;SRC='snap'}
  applyLang();
})();
</script>
