  <h3 id="h-inicio">Qué es SatScope</h3>
  <p>SatScope te dice cada semana cuánto Bitcoin comprar siguiendo un <strong>DCA dinámico</strong>: en lugar de comprar siempre la misma cantidad, compra más cuando el mercado tiene miedo, no compra cuando está tranquilo y vende un poco cuando hay euforia.</p>
  <p>Todo se calcula en tu navegador con datos públicos. No necesitas cuenta.</p>

  <h3 id="h-semana">Qué hacer cada semana</h3>
  <ol>
    <li>Abre SatScope a partir del <strong>lunes</strong>. La señal sale del cierre semanal del domingo y no cambia en toda la semana.</li>
    <li>Lee la acción: <strong>Comprar</strong> (cuánto), <strong>Esperar</strong> o <strong>Vender</strong> (cuánto BTC).</li>
    <li>Haz la operación donde compres habitualmente, por ejemplo en Polygon.</li>
    <li>Pulsa <strong>«Marcar como hecha»</strong> y corrige el importe y los BTC con lo que pagaste y recibiste de verdad.</li>
  </ol>
  <p>Si quieres que te lo recuerde, usa <strong>«Recordatorio semanal»</strong> (en Tu cartera): añade a tu calendario un aviso cada lunes a las 9:00.</p>

  <h3 id="h-puntuacion">La puntuación</h3>
  <p>Va de <strong>0</strong> (miedo extremo: el precio está barato respecto a su historia) a <strong>100</strong> (euforia). Según el tramo, tu aportación base de <span data-v="usd:base"></span> se multiplica así:</p>
  <table class="tbl"><thead><tr><th scope="col">Puntuación</th><th scope="col">Multiplicador</th><th scope="col">Compra</th></tr></thead><tbody>
    <tr><th scope="row">0–20</th><td data-v="mul:0"></td><td data-v="amt:0"></td></tr>
    <tr><th scope="row">20–40</th><td data-v="mul:1"></td><td data-v="amt:1"></td></tr>
    <tr><th scope="row">40–60</th><td data-v="mul:2"></td><td data-v="amt:2"></td></tr>
    <tr><th scope="row">60–80</th><td data-v="mul:3"></td><td data-v="amt:3"></td></tr>
    <tr><th scope="row">80–100</th><td data-v="mul:4"></td><td data-v="amt:4"></td></tr>
  </tbody></table>
  <p>Desde <span data-v="n:sellAt"></span> puntos se vende en lugar de comprar (ver <a href="#h-venta" data-help="venta">Ventas y reserva</a>).</p>
  <p>El gráfico <strong>«Puntuación de las últimas 104 semanas»</strong> muestra cómo ha ido cambiando: la zona verde son los tramos en los que se compra y la línea discontinua, el umbral de venta.</p>

  <h3 id="h-indicadores">Los cuatro indicadores</h3>
  <p>La puntuación es la media ponderada de cuatro indicadores, cada uno llevado a una escala de 0 a 100. Cada tarjeta muestra el valor del indicador y lo que aporta.</p>
  <dl>
    <dt>Fear &amp; Greed · peso <span data-v="n:wF"></span></dt>
    <dd>El índice de sentimiento del mercado de alternative.me. Se usa tal cual.</dd>
    <dt>Caída desde máximo · peso <span data-v="n:wD"></span></dt>
    <dd>Cuánto está el precio por debajo de su máximo histórico. Sin caída aporta 100; con una caída del 80 % o más, 0. Es el indicador con más peso.</dd>
    <dt>Precio / MA200 semanas · peso <span data-v="n:wW"></span></dt>
    <dd>El precio dividido entre la media de los últimos 200 cierres semanales. En escala logarítmica: en la media (×1) o por debajo aporta 0, y a ×5 aporta 100.</dd>
    <dt>RSI semanal · peso <span data-v="n:wR"></span></dt>
    <dd>El índice de fuerza relativa de 14 semanas, con el suavizado de Wilder (el mismo que usa TradingView).</dd>
  </dl>

  <h3 id="h-venta">Ventas y reserva</h3>
  <p>Cuando la puntuación llega a <span data-v="n:sellAt"></span> o más, toca vender el <span data-v="pct:sellPct"></span> del BTC que tienes. Si llevas el registro, la app te dice la cantidad exacta.</p>
  <p>Lo que cobras pasa a tu <strong>reserva de ventas</strong>. Cuando la puntuación baja de <span data-v="n:reuseBelow"></span> (miedo extremo), la compra de esa semana se duplica con dinero de la reserva, hasta agotarla. La app calcula la reserva sola a partir del registro.</p>
  <p>En el backtest, vender poco y reutilizar lo vendido en las caídas da un resultado parecido a no vender nunca, pero recoge beneficios en las fases de euforia y deja dinero listo para la siguiente caída.</p>

  <h3 id="h-cartera">Tu cartera y el registro</h3>
  <p>Cada operación que apuntas, con «Marcar como hecha» o con «Añadir operación a mano», alimenta el resumen:</p>
  <ul>
    <li><strong>BTC</strong>: lo que tienes según el registro.</li>
    <li><strong>Valor hoy</strong>: tus BTC al precio actual, más la reserva.</li>
    <li><strong>Dinero aportado</strong>: lo que has puesto de tu bolsillo. Lo pagado con la reserva no cuenta.</li>
    <li><strong>Rentabilidad</strong>: el valor de hoy frente al dinero aportado.</li>
    <li><strong>Precio medio</strong>: lo pagado en total entre los BTC comprados.</li>
    <li><strong>Reserva de ventas</strong>: lo cobrado en ventas menos lo que ya has reutilizado.</li>
    <li><strong>Semanas saltadas</strong>: semanas ya cerradas en las que tocaba comprar o vender y no apuntaste nada.</li>
  </ul>
  <p>Tipos de operación: <strong>Compra</strong> (importe pagado, BTC recibido y parte pagada con la reserva), <strong>Venta</strong> (dólares recibidos y BTC vendido) y <strong>Ajuste de reserva</strong> (dinero que sumas a la reserva o, en negativo, que restas).</p>
  <p><strong>Si compras WBTC en Polygon</strong>, elige «WBTC (Polygon)» en «Lo que compras» (en los ajustes): la app hablará de WBTC. Si además escribes tu dirección pública de Polygon, la app lee tu saldo de WBTC, lo compara con el registro y te avisa si falta apuntar algo. Las ventas se calculan entonces con el saldo real de la wallet. Solo se lee: nunca se piden claves ni se firma nada.</p>
  <p class="warn">El registro se guarda <strong>solo en este navegador</strong>. Usa «Exportar CSV» de vez en cuando como copia, e «Importar CSV» para recuperarlo en otro dispositivo. Al importar no se duplican las operaciones repetidas.</p>

  <h3 id="h-backtest">Backtest</h3>
  <p>Simula semana a semana tu estrategia, con los ajustes actuales y desde el año que elijas, y la compara con un <strong>DCA fijo</strong>: la aportación base todas las semanas. Usa los datos guardados para los años antiguos y los datos en directo para las semanas recientes. No incluye comisiones.</p>
  <p>El dato principal es cuánto vale hoy tu estrategia <strong>más o menos que el DCA fijo</strong>. La rentabilidad aparece como dato secundario porque se calcula sobre lo invertido, y tu estrategia no invierte lo mismo que el DCA fijo: si invierte menos, el porcentaje exagera la ventaja.</p>
  <p>Sirve para comparar ajustes, no para predecir: el histórico de Bitcoin solo tiene unos pocos ciclos.</p>

  <h3 id="h-ajustes">Ajustes</h3>
  <p>En «Ajustes de la estrategia» puedes cambiar la aportación base, los pesos de los indicadores, el multiplicador de cada tramo, el umbral y el porcentaje de venta, y desde qué puntuación se usa la reserva. Todo se recalcula al instante, también el backtest y esta ayuda.</p>
  <p>Solo se guardan los valores que cambias. Con «Restablecer valores por defecto» vuelves a los de la app (tienes unos segundos para deshacerlo); no toca el idioma, el tema ni tu registro. «Mostrar equivalencia en euros» solo cambia lo que ves: la estrategia y el registro van en dólares.</p>

  <h3 id="h-datos">De dónde salen los datos</h3>
  <ul>
    <li><strong>Precios</strong>: velas diarias de Binance (BTC/USDT). Si Binance falla, de Bitstamp (BTC/USD).</li>
    <li><strong>Fear &amp; Greed</strong>: alternative.me. Si falla, se usan los valores guardados.</li>
    <li><strong>Euros</strong>: el cambio EUR/USD de Binance o de Bitstamp.</li>
    <li><strong>Saldo de WBTC</strong> (opcional): nodos públicos de Polygon (publicnode, 1rpc o drpc).</li>
  </ul>
  <p>Si no hay ninguna fuente disponible, la app usa una copia semanal guardada en la propia página. La línea bajo «SatScope» dice siempre qué datos se están usando.</p>
  <p><strong>Semanas cerradas</strong>: la señal usa el cierre del domingo, que termina a las 00:00 UTC del lunes (la 1:00 o las 2:00 en España). Por eso es la misma toda la semana.</p>

  <h3 id="h-app">Instalar y actualizar</h3>
  <ul>
    <li><strong>Instalar</strong>: en Android y en Chrome o Edge de escritorio, con el botón «Instalar app» o el icono de la barra de direcciones. En iPhone o iPad, Compartir → «Añadir a pantalla de inicio».</li>
    <li><strong>Sin conexión</strong>: la app abre igual y usa los datos guardados.</li>
    <li><strong>Versiones nuevas</strong>: aparece un aviso abajo; pulsa «Actualizar».</li>
    <li><strong>Recordatorio</strong>: «Recordatorio semanal» añade a tu calendario un aviso cada lunes a las 9:00.</li>
  </ul>

  <h3 id="h-privacidad">Privacidad</h3>
  <p>No hay cuentas. Tus ajustes, el idioma, el tema y el registro se guardan solo en tu navegador. Los precios los pide tu navegador directamente a Binance, Bitstamp y alternative.me. Si escribes tu dirección de Polygon, tu navegador la envía a un nodo público de Polygon para leer el saldo, como hace cualquier wallet; ese nodo puede ver tu IP junto a la dirección. La web cuenta las visitas con Vercel Web Analytics, sin cookies ni datos personales.</p>

  <h3 id="h-faq">Preguntas frecuentes</h3>
  <dl>
    <dt>¿Qué hago si me salto una semana?</dt>
    <dd>Nada especial: no hace falta recuperarla. La semana siguiente sigue la acción que toque. Aparecerá en «Semanas saltadas» para que lo tengas en cuenta.</dd>
    <dt>¿Por qué la puntuación no cambia aunque el precio se mueva?</dt>
    <dd>Porque solo usa semanas cerradas. El precio actual aparece debajo de la acción, pero la señal no cambia hasta el próximo cierre del domingo.</dd>
    <dt>¿Por qué todo va en dólares?</dt>
    <dd>Porque las compras se hacen en dólares (USDC). Si te resulta útil, activa la equivalencia en euros en los ajustes.</dd>
    <dt>He cambiado de móvil, ¿cómo recupero mi registro?</dt>
    <dd>Exporta el CSV en el dispositivo antiguo e impórtalo en el nuevo. Si ya no tienes el antiguo, añade las operaciones a mano.</dd>
    <dt>Arriba pone «Sin conexión a las APIs».</dt>
    <dd>Las fuentes de datos no responden y la app está usando los datos guardados. Comprueba tu conexión y vuelve a abrirla.</dd>
  </dl>

  <h3 id="h-codigo">Código fuente</h3>
  <p>SatScope es de código abierto, con licencia MIT. Puedes ver cómo se calcula todo, descargarlo o proponer cambios en GitHub:</p>
  <p><a href="https://github.com/rzazo24/satscope" target="_blank" rel="noopener">github.com/rzazo24/satscope</a></p>
  <p>Si encuentras un error o tienes una idea, abre una <a href="https://github.com/rzazo24/satscope/issues" target="_blank" rel="noopener">incidencia en GitHub</a>.</p>

  <p class="warn">SatScope es una herramienta de análisis basada en datos históricos. <strong>No es asesoramiento financiero.</strong> Invierte solo dinero que puedas dejar quieto durante años.</p>
</template>

  <h3 id="h-inicio">What SatScope is</h3>
  <p>Every week, SatScope tells you how much Bitcoin to buy using <strong>dynamic DCA</strong>: instead of always buying the same amount, it buys more when the market is fearful, holds when it's calm and sells a little when there's euphoria.</p>
  <p>Everything is worked out in your browser from public data. You don't need an account.</p>

  <h3 id="h-semana">What to do each week</h3>
  <ol>
    <li>Open SatScope from <strong>Monday</strong> on. The signal comes from Sunday's weekly close and stays the same all week.</li>
    <li>Read the action: <strong>Buy</strong> (how much), <strong>Hold</strong> or <strong>Sell</strong> (how much BTC).</li>
    <li>Make the trade wherever you usually buy, for example on Polygon.</li>
    <li>Tap <strong>"Mark as done"</strong> and correct the amount and BTC to what you actually paid and received.</li>
  </ol>
  <p>If you'd like a reminder, use <strong>"Weekly reminder"</strong> (under Your portfolio): it adds an alert to your calendar every Monday at 9:00.</p>

  <h3 id="h-puntuacion">The score</h3>
  <p>It runs from <strong>0</strong> (extreme fear: the price is cheap compared with its history) to <strong>100</strong> (euphoria). Depending on the band, your base amount of <span data-v="usd:base"></span> is multiplied like this:</p>
  <table class="tbl"><thead><tr><th scope="col">Score</th><th scope="col">Multiplier</th><th scope="col">Buy</th></tr></thead><tbody>
    <tr><th scope="row">0–20</th><td data-v="mul:0"></td><td data-v="amt:0"></td></tr>
    <tr><th scope="row">20–40</th><td data-v="mul:1"></td><td data-v="amt:1"></td></tr>
    <tr><th scope="row">40–60</th><td data-v="mul:2"></td><td data-v="amt:2"></td></tr>
    <tr><th scope="row">60–80</th><td data-v="mul:3"></td><td data-v="amt:3"></td></tr>
    <tr><th scope="row">80–100</th><td data-v="mul:4"></td><td data-v="amt:4"></td></tr>
  </tbody></table>
  <p>From <span data-v="n:sellAt"></span> points on, it sells instead of buying (see <a href="#h-venta" data-help="venta">Sales and reserve</a>).</p>
  <p>The <strong>"Score over the last 104 weeks"</strong> chart shows how it has changed: the green zone is the bands that buy and the dashed line is the sell threshold.</p>

  <h3 id="h-indicadores">The four indicators</h3>
  <p>The score is a weighted average of four indicators, each mapped to a 0–100 scale. Each card shows the indicator's value and what it contributes.</p>
  <dl>
    <dt>Fear &amp; Greed · weight <span data-v="n:wF"></span></dt>
    <dd>alternative.me's market sentiment index, used as is.</dd>
    <dt>Drawdown from ATH · weight <span data-v="n:wD"></span></dt>
    <dd>How far the price is below its all-time high. No drawdown contributes 100; a drawdown of 80% or more, 0. It's the indicator with the most weight.</dd>
    <dt>Price / 200-week MA · weight <span data-v="n:wW"></span></dt>
    <dd>The price divided by the average of the last 200 weekly closes. On a log scale: at the average (×1) or below it contributes 0, and at ×5 it contributes 100.</dd>
    <dt>Weekly RSI · weight <span data-v="n:wR"></span></dt>
    <dd>The 14-week relative strength index, with Wilder's smoothing (the same one TradingView uses).</dd>
  </dl>

  <h3 id="h-venta">Sales and reserve</h3>
  <p>When the score reaches <span data-v="n:sellAt"></span> or more, it's time to sell <span data-v="pct:sellPct"></span> of the BTC you hold. If you keep the trade log, the app tells you the exact amount.</p>
  <p>What you get goes into your <strong>sales reserve</strong>. When the score drops below <span data-v="n:reuseBelow"></span> (extreme fear), that week's purchase is doubled with money from the reserve, until it runs out. The app works out the reserve from the trade log.</p>
  <p>In the backtest, selling a little and reusing the proceeds in downturns gives a result close to never selling, but it takes some profit in euphoric phases and leaves money ready for the next drop.</p>

  <h3 id="h-cartera">Your portfolio and trade log</h3>
  <p>Every trade you log, with "Mark as done" or "Add a trade by hand", feeds the summary:</p>
  <ul>
    <li><strong>BTC</strong>: what you hold according to the log.</li>
    <li><strong>Value today</strong>: your BTC at the current price, plus the reserve.</li>
    <li><strong>Money put in</strong>: what came out of your pocket. Purchases paid from the reserve don't count.</li>
    <li><strong>Return</strong>: today's value compared with the money put in.</li>
    <li><strong>Average price</strong>: the total paid divided by the BTC bought.</li>
    <li><strong>Sales reserve</strong>: cash from sales minus what you've already reused.</li>
    <li><strong>Weeks skipped</strong>: closed weeks when you were due to buy or sell and didn't log anything.</li>
  </ul>
  <p>Trade types: <strong>Buy</strong> (amount paid, BTC received and the part paid from the reserve), <strong>Sell</strong> (dollars received and BTC sold) and <strong>Reserve adjustment</strong> (money you add to the reserve or, as a negative, take from it).</p>
  <p><strong>If you buy WBTC on Polygon</strong>, choose "WBTC (Polygon)" under "What you buy" (in the settings) and the app will talk about WBTC. If you also enter your public Polygon address, the app reads your WBTC balance, compares it with the log and tells you if something is missing. Sales are then worked out from your real wallet balance. It's read-only: no keys are ever asked for and nothing is signed.</p>
  <p class="warn">The log is saved <strong>only in this browser</strong>. Use "Export CSV" now and then as a backup, and "Import CSV" to restore it on another device. Importing never duplicates trades you already have.</p>

  <h3 id="h-backtest">Backtest</h3>
  <p>It simulates your strategy week by week, with the current settings and from the year you choose, and compares it with <strong>fixed DCA</strong>: the base amount every week. It uses saved data for the early years and live data for recent weeks. It doesn't include fees.</p>
  <p>The main figure is how much your strategy is worth today <strong>more or less than fixed DCA</strong>. Return is shown as a secondary figure because it's worked out on the money invested, and your strategy doesn't invest the same as fixed DCA: if it invests less, the percentage overstates the advantage.</p>
  <p>Use it to compare settings, not to predict: Bitcoin's history only has a few cycles.</p>

  <h3 id="h-ajustes">Settings</h3>
  <p>Under "Strategy settings" you can change the base amount, the indicator weights, each band's multiplier, the sell threshold and percentage, and the score below which the reserve is used. Everything updates instantly, including the backtest and this help.</p>
  <p>Only the values you change are saved. "Reset to defaults" brings back the app's values (you get a few seconds to undo it); it doesn't touch the language, theme or your trade log. "Show euro equivalent" only changes what you see: the strategy and the log stay in dollars.</p>

  <h3 id="h-datos">Where the data comes from</h3>
  <ul>
    <li><strong>Prices</strong>: daily candles from Binance (BTC/USDT). If Binance fails, from Bitstamp (BTC/USD).</li>
    <li><strong>Fear &amp; Greed</strong>: alternative.me. If it fails, saved values are used.</li>
    <li><strong>Euros</strong>: the EUR/USD rate from Binance or Bitstamp.</li>
    <li><strong>WBTC balance</strong> (optional): public Polygon nodes (publicnode, 1rpc or drpc).</li>
  </ul>
  <p>If no source is available, the app uses a weekly copy saved in the page itself. The line under "SatScope" always says which data is in use.</p>
  <p><strong>Closed weeks</strong>: the signal uses Sunday's close, which ends at 00:00 UTC on Monday. That's why it stays the same all week.</p>

  <h3 id="h-app">Installing and updating</h3>
  <ul>
    <li><strong>Install</strong>: on Android and in desktop Chrome or Edge, with the "Install app" button or the icon in the address bar. On iPhone or iPad, Share → "Add to Home Screen".</li>
    <li><strong>Offline</strong>: the app still opens and uses saved data.</li>
    <li><strong>New versions</strong>: a notice appears at the bottom; tap "Update".</li>
    <li><strong>Reminder</strong>: "Weekly reminder" adds an alert to your calendar every Monday at 9:00.</li>
  </ul>

  <h3 id="h-privacidad">Privacy</h3>
  <p>There are no accounts. Your settings, language, theme and trade log are saved only in your browser. Your browser fetches prices directly from Binance, Bitstamp and alternative.me. If you enter your Polygon address, your browser sends it to a public Polygon node to read the balance, just like any wallet does; that node can see your IP alongside the address. The site counts visits with Vercel Web Analytics, with no cookies and no personal data.</p>

  <h3 id="h-faq">FAQ</h3>
  <dl>
    <dt>What if I skip a week?</dt>
    <dd>Nothing special: there's no need to catch up. The next week, just follow whatever action comes up. It will show under "Weeks skipped" so you're aware of it.</dd>
    <dt>Why doesn't the score change when the price moves?</dt>
    <dd>Because it only uses closed weeks. The current price appears below the action, but the signal doesn't change until the next Sunday close.</dd>
    <dt>Why is everything in dollars?</dt>
    <dd>Because purchases are made in dollars (USDC). If it helps, turn on the euro equivalent in the settings.</dd>
    <dt>I've changed phones. How do I get my trade log back?</dt>
    <dd>Export the CSV on the old device and import it on the new one. If you no longer have the old one, add the trades by hand.</dd>
    <dt>The header says "APIs unreachable".</dt>
    <dd>The data sources aren't responding and the app is using saved data. Check your connection and open it again.</dd>
  </dl>

  <h3 id="h-codigo">Source code</h3>
  <p>SatScope is open source, under the MIT license. You can see how everything is worked out, download it or suggest changes on GitHub:</p>
  <p><a href="https://github.com/rzazo24/satscope" target="_blank" rel="noopener">github.com/rzazo24/satscope</a></p>
  <p>If you find a bug or have an idea, open an <a href="https://github.com/rzazo24/satscope/issues" target="_blank" rel="noopener">issue on GitHub</a>.</p>

  <p class="warn">SatScope is an analysis tool based on historical data. <strong>It isn't financial advice.</strong> Only invest money you can leave untouched for years.</p>
</template>

function applyLang(){
  const t=T();document.documentElement.lang=LANG;

  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);

// PWA: service worker y botón de instalar
// Aviso de nueva versión: cuando un service worker nuevo termina de descargarse, se ofrece recargar.
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',async()=>{
  let reg;try{reg=await navigator.serviceWorker.register('/sw.js')}catch(e){return}
  const offer=w=>{if(!w||!navigator.serviceWorker.controller)return;$('update').hidden=false;$('updGo').onclick=()=>{$('updGo').disabled=true;w.postMessage('SKIP_WAITING')}};
  if(reg.waiting)offer(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')offer(w)})});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload()}});
  // Con la app abierta mucho tiempo: busca versiones nuevas cada hora y al volver a ella.
  setInterval(()=>reg.update().catch(()=>{}),36e5);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
});

// RSI de Wilder (14 periodos), el mismo que TradingView: las medias de subidas y bajadas
// se suavizan como (anterior × 13 + actual) / 14
function wilder(p,n=14){
  const out=p.map(()=>null);if(p.length<=n)return out;
  let g=0,l=0;for(let i=1;i<=n;i++){const d=p[i]-p[i-1];if(d>0)g+=d;else l-=d}
  g/=n;l/=n;const rsi=()=>l===0?100:100-100/(1+g/l);out[n]=rsi();
  for(let i=n+1;i<p.length;i++){const d=p[i]-p[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;out[i]=rsi()}
  return out;
}

function parts(r){return{f:r.fng,d:clamp((1-r.dd/80)*100),w:clamp(Math.log(r.w200)/Math.log(5)*100),r:r.rsi}}
function score(r,c){const p=parts(r);const L=[[p.f,c.wF],[p.d,c.wD],[p.w,c.wW],[p.r,c.wR]].filter(x=>x[0]!=null&&x[1]>0);let a=0,b=0;for(const[v,w]of L){a+=v*w;b+=w}return b?a/b:null}

// Datos en directo: velas diarias de Binance (o de Bitstamp si Binance falla) + Fear & Greed de alternative.me.
// La señal usa solo semanas cerradas: el cierre semanal es el cierre del domingo en UTC,
// igual que la vela semanal de Binance. Así la acción no cambia a lo largo de la semana.
const getJSON=async u=>{const r=await fetch(u,{signal:AbortSignal.timeout(10000)});if(!r.ok)throw new Error(u+' '+r.status);return r.json()};
// Cada fuente devuelve velas {t: apertura en ms, c: cierre, e: hora de cierre en ms}, de la más antigua a la más reciente
async function binance(){
  const k=[];let end=Date.now();
  for(let n=0;n<3;n++){
    const a=await getJSON(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000&endTime=${end}`);if(!a.length)break;
    k.unshift(...a.map(x=>({t:x[0],c:+x[4],e:x[6]})));end=a[0][0]-1;
  }
  return k;
}
async function bitstamp(){
  const k=[];let end=Math.floor(Date.now()/1000);
  for(let n=0;n<3;n++){
    const a=(await getJSON(`https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=86400&limit=1000&end=${end}`)).data.ohlc;if(!a.length)break;
    k.unshift(...a.map(x=>({t:+x.timestamp*1000,c:+x.close,e:+x.timestamp*1000+864e5-1})));end=+a[0].timestamp-1;
  }
  return k;
}
const SOURCES=[['Binance',binance],['Bitstamp',bitstamp]];
async function live(){
  let k=null,src=null;
  for(const[name,f]of SOURCES){try{const a=await f();if(a.length>=1600){k=a;src=name;break}}catch(e){}}
  if(!k)throw new Error('sin precios');
  const now=k.at(-1).c;
  while(k.length&&k.at(-1).e>Date.now())k.pop(); // descarta la vela de hoy, aún abierta
  // Si Fear & Greed falla, se siguen usando los precios en directo y Fear & Greed sale de la instantánea
  // (el valor semanal guardado más cercano, a 3 días como mucho). Si no hay, la puntuación se calcula sin él.
  let fm=null,fngSrc='live';
  try{const f=await getJSON('https://api.alternative.me/fng/?limit=0');fm=new Map(f.data.map(x=>[new Date(+x.timestamp*1000).toISOString().slice(0,10),+x.value]))}catch(e){}
  if(!fm){
    fngSrc='snap';const sf=new Map(SNAP.filter(r=>r.fng!=null).map(r=>[r.t,r.fng]));
    const near=t=>{for(const k of[0,1,-1,2,-2,3,-3]){const v=sf.get(new Date(Date.parse(t)+k*864e5).toISOString().slice(0,10));if(v!=null)return v}return null};
    fm={get:near};
  }
  // Cierres de los domingos, con el máximo histórico hasta ese día
  const W=[];let m=0,last=null;
  for(const x of k){
    if(last!=null&&x.t<=last)continue;last=x.t; // por si una página repite velas
    m=Math.max(m,x.c);if(new Date(x.t).getUTCDay()===0)W.push({t:new Date(x.t).toISOString().slice(0,10),p:x.c,ath:m});
  }
  const rs=wilder(W.map(w=>w.p));
  const rows=[];let sum=0;
  for(let i=0;i<W.length;i++){
    sum+=W[i].p;if(i>=200)sum-=W[i-200].p;if(i<199)continue; // MA de 200 cierres semanales
    rows.push({t:W[i].t,p:W[i].p,w200:W[i].p/(sum/200),rsi:rs[i],fng:fm.get(W[i].t)??null,dd:(1-W[i].p/W[i].ath)*100});
  }
  if(rows.length<10)throw new Error('pocos datos');
  if(fngSrc==='snap'&&rows.at(-1).fng==null)fngSrc='none';
  return {rows,now,src,fng:fngSrc};
}

// Backtest semanal: tu estrategia frente a un DCA fijo con la aportación base
function backtest(rows,c){
  let inv=0,spent=0,btc=0,bought=0,cash=0,dInv=0,dBtc=0;const vals=[];
  for(const r of rows){
    const s=score(r,c);if(s==null)continue;
    if(s>=c.sellAt){const q=btc*c.sellPct/100;btc-=q;cash+=q*r.p}
    else{const m=c['m'+Math.min(4,Math.floor(s/20))];if(m>0){
      let a=c.base*m;inv+=a;
      if(s<c.reuseBelow&&cash>0){const x=Math.min(cash,a);cash-=x;a+=x} // la reserva de ventas duplica la compra en miedo extremo
      spent+=a;btc+=a/r.p;bought+=a/r.p}}
    dInv+=c.base;dBtc+=c.base/r.p;
    vals.push([btc*r.p+cash,dBtc*r.p]);
  }
  const last=rows.at(-1).p,S={inv,btc,cash,val:btc*last+cash,avg:bought?spent/bought:null},D={inv:dInv,btc:dBtc,cash:0,val:dBtc*last,avg:dBtc?dInv/dBtc:null};
  for(const o of[S,D])o.ret=o.inv?(o.val-o.inv)/o.inv*100:0;
  return {S,D,vals};
}
// Comparación del backtest: diferencia de valor hoy (dato principal) y de dinero invertido
function btCompare(S,D){return {diff:S.val-D.val,inv:S.inv-D.inv}}

function ledgerStats(){

    if(o.type==='buy'){btc+=o.btc;bought+=o.btc;spent+=o.usd;fromRes+=o.res}

const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(iso,n)=>new Date(Date.parse(iso)+n*864e5).toISOString().slice(0,10);
// Semana a la que pertenece una operación: la que va del lunes al domingo tras el cierre semanal t
const inWeek=(d,t)=>SRC==='live'?(d>t&&d<=addDays(t,7)):(d>=t&&d<addDays(t,7));
function decide(sc,c){
  if(sc==null)return {kind:'none'};
  if(sc>=c.sellAt)return {kind:'sell'};
  const m=c['m'+Math.min(4,Math.floor(sc/20))];
  return m>0?{kind:'buy',mult:m,usd:c.base*m}:{kind:'hold'};
}
// Semanas cerradas desde la primera operación en las que tocaba comprar o vender y no se apuntó nada
function skipped(c){
  const first=LEDGER.find(o=>o.type!=='res');if(!first)return 0;
  let n=0;
  for(const r of ROWS.slice(0,-1)){
    if(addDays(r.t,7)<first.d)continue;
    const a=decide(score(r,c),c);
    if((a.kind==='buy'||a.kind==='sell')&&!LEDGER.some(o=>o.type===a.kind&&inWeek(o.d,r.t)))n++;

}
// Saldo de WBTC en Polygon: lectura pública con eth_call a balanceOf del contrato de WBTC (8 decimales).
// Solo lee: no hay claves ni firmas. Se prueban varios nodos públicos por si alguno falla.
const WBTC_POLYGON='0x1BFD67037B42Cf73acF2047067bd4F2C47D9BfD6';
const POLYGON_RPC=['https://polygon-bor-rpc.publicnode.com','https://1rpc.io/matic','https://polygon.drpc.org'];
const isAddr=a=>/^0x[0-9a-fA-F]{40}$/.test(a);
const balanceOfData=a=>'0x70a08231'+a.slice(2).toLowerCase().padStart(64,'0');
const fromUnits=(hex,dec=8)=>Number(BigInt(hex==='0x'?'0x0':hex))/10**dec;
async function wbtcBalance(addr){
  if(!isAddr(addr))throw new Error('dirección no válida');
  const body=JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to:WBTC_POLYGON,data:balanceOfData(addr)},'latest']});
  for(const url of POLYGON_RPC){
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body,signal:AbortSignal.timeout(10000)});
      if(!r.ok)continue;
      const j=await r.json();
      if(typeof j.result==='string'&&/^0x[0-9a-fA-F]*$/.test(j.result))return fromUnits(j.result);
    }catch(e){}
  }
  throw new Error('ningún nodo de Polygon ha respondido');
}

// Migración de ajustes: la versión anterior guardaba todos los valores; se conserva solo lo que
// difería de sus valores por defecto, para que los valores por defecto nuevos lleguen a todos
// (la función se declara aquí pero se usa al arrancar, así que no puede depender de constantes de más abajo)
function migrateCfg(old,ids){
  const OLD_DEF={base:5,wF:30,wD:40,wW:15,wR:15,m0:5,m1:1,m2:0,m3:0,m4:0,sellAt:75,sellPct:5},keep={};
  for(const k of ids)if(old[k]!=null&&+old[k]!==OLD_DEF[k])keep[k]=+old[k];
  return keep;
}

const CSV_HEAD='date,type,usd,btc,from_reserve';
function toCSV(list){return CSV_HEAD+'\n'+list.map(o=>[o.d,o.type,o.usd,o.btc,o.res].join(',')).join('\n')+'\n'}
function parseCSV(text){
  const lines=String(text).trim().split(/\r?\n/);
  if(!/^date,type,usd,btc/.test(lines[0]))throw new Error('cabecera');
  return lines.slice(1).filter(l=>l.trim()).map(l=>{
    const [d,type,u,b,r]=l.split(',');const o={id:newId(),d,type,usd:+u,btc:+b||0,res:+r||0};
    if(!okOp(o))throw new Error('fila: '+l);
    return o;
  });
}
// Añade las operaciones nuevas y salta las que ya estaban (misma fecha, tipo e importes)
function mergeOps(list,incoming){
  const key=o=>[o.d,o.type,o.usd,o.btc,o.res].join('|'),have=new Set(list.map(key)),out=[...list];let added=0;
  for(const o of incoming)if(!have.has(key(o))){out.push(o);have.add(key(o));added++}
  return {list:out,added};
}

function renderBt(c){
  const t=T(),sel=$('btFrom');

  const {S,D,vals}=backtest(rows,c);
  // Dato principal: diferencia de valor hoy. Se redondea cada columna antes de restar, para que la cifra
  // coincida siempre con la resta de los importes que muestra la tabla (redondear la diferencia podía dar 1 $ de más o de menos)
  const {diff:d,inv:di}=btCompare({val:Math.round(S.val),inv:Math.round(S.inv)},{val:Math.round(D.val),inv:Math.round(D.inv)});
  // Espacio fino irrompible entre la cifra y el símbolo: con la letra grande, el espacio normal se ve demasiado ancho
  $('btDiffV').textContent=(d>0?'+'+usd(d):usd(Math.abs(d))).replace(' ','\u202f');
  $('btDiffV').className=d>0?'up':d<0?'down':'';
  $('btDiffT').textContent=d>0?t.btMore:d<0?t.btLess:t.btSame;
  $('btDiffSub').textContent=(di>0?t.btInvMore(usd(di)):di<0?t.btInvLess(usd(-di)):t.btInvSame)+' '+t.btRetSub(pct(S.ret),pct(D.ret));
  const row=(k,f,cls='')=>`<tr${cls?` class="${cls}"`:''}><th scope="row">${t[k]}</th><td>${f(S)}</td><td>${f(D)}</td></tr>`;
  $('btTbl').innerHTML=`<thead><tr><th></th><th scope="col">${t.btDyn}</th><th scope="col">${t.btDca}</th></tr></thead><tbody>`+
    row('rVal',o=>usd(o.val))+row('rInv',o=>usd(o.inv))+row('rBtc',o=>fmt(o.btc,5))+row('rSold',o=>usd(o.cash))+row('rAvg',o=>o.avg?usd(o.avg):'–')+row('rRet',o=>pct(o.ret),'sec')+'</tbody>';
  drawBt(vals,rows[0].t,rows.at(-1).t);
}
function drawBt(v,from,to){
  const cv=$('btChart'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
  const max=Math.max(...v.flat())*1.05||1,L=44,R=6,T=6,B=18,w=W-L-R,h=H-T-B,x=i=>L+i/(v.length-1)*w,y=val=>T+h-val/max*h;
  g.font='10px IBM Plex Mono, monospace';g.fillStyle=col('--muted');g.strokeStyle=col('--line');g.lineWidth=1;g.textAlign='right';
  for(const f of[0,.5,1]){const val=max*f/1.05;g.beginPath();g.moveTo(L,y(val));g.lineTo(L+w,y(val));g.stroke();g.fillText(val>=1000?fmt(val/1000,1)+'k':fmt(val),L-4,y(val)+3)}
  g.textAlign='left';g.fillText(from.slice(0,7),L,H-4);g.textAlign='right';g.fillText(to.slice(0,7),L+w,H-4);
  for(const[k,c,lw]of[[1,'--muted',1.5],[0,'--accent',2]]){g.strokeStyle=col(c);g.lineWidth=lw;g.beginPath();v.forEach((p,i)=>i?g.lineTo(x(i),y(p[k])):g.moveTo(x(i),y(p[k])));g.stroke()}
  cv.setAttribute('aria-label',I18N[LANG].btAria(from.slice(0,7),to.slice(0,7),usd(v.at(-1)[0]),usd(v.at(-1)[1])));
}
$('btFrom').addEventListener('change',()=>{try{localStorage.setItem('btFrom',$('btFrom').value)}catch(e){}render()});
function draw(s,c){
  const cv=$('chart'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
  const L=28,R=6,T=6,B=6,w=W-L-R,h=H-T-B,x=i=>L+i/(s.length-1)*w,y=v=>T+h-v/100*h;
  let buyTop=0;for(let k=0;k<5;k++)if(c['m'+k]>0)buyTop=(k+1)*20;
  g.globalAlpha=.12;g.fillStyle=col('--buy');g.fillRect(L,y(buyTop),w,y(0)-y(buyTop));g.globalAlpha=1;
  g.font='10px IBM Plex Mono, monospace';g.fillStyle=col('--muted');g.strokeStyle=col('--line');g.lineWidth=1;g.textAlign='right';
  for(const v of[0,50,100]){g.beginPath();g.moveTo(L,y(v));g.lineTo(L+w,y(v));g.stroke();g.fillText(v,L-4,y(v)+3)}
  g.setLineDash([4,4]);g.strokeStyle=col('--sell');g.beginPath();g.moveTo(L,y(c.sellAt));g.lineTo(L+w,y(c.sellAt));g.stroke();g.setLineDash([]);
  g.strokeStyle=col('--accent');g.lineWidth=2;g.beginPath();s.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.stroke();
  g.fillStyle=col('--accent');g.beginPath();g.arc(x(s.length-1),y(s.at(-1)),4,0,7);g.fill();
  const ok=s.filter(v=>v!=null);cv.setAttribute('aria-label',I18N[LANG].chartAria(fmt(Math.min(...ok)),fmt(Math.max(...ok)),fmt(s.at(-1)),fmt(c.sellAt)));
}
for(const k of IDS)$(k).addEventListener('input',render);
for(const k of IDS)$(k).addEventListener('input',()=>{if($('help').open)fillHelp()});
// Restablecer la estrategia: vuelve a los valores por defecto y permite deshacerlo durante unos segundos
let resetTimer=null;
function setCfg(v){for(const k of IDS)$(k).value=v[k];render();if($('help').open)fillHelp()}
$('resetBtn').addEventListener('click',()=>{
  const before=cfg();setCfg(DEF);
  const msg=$('resetMsg'),t=T();
  msg.innerHTML=`${t.resetDone} <button type="button" class="lnk" id="resetUndo">${t.undo}</button>`;
  $('resetUndo').onclick=()=>{setCfg(before);msg.textContent='';clearTimeout(resetTimer)};
  clearTimeout(resetTimer);resetTimer=setTimeout(()=>msg.textContent='',8000);
});
for(const k of IDS)$(k).addEventListener('input',()=>{clearTimeout(resetTimer);$('resetMsg').textContent=''});
addEventListener('resize',render);
let savedTheme=null;try{savedTheme=localStorage.getItem('theme')}catch(e){}
applyTheme(savedTheme);applyLang();
(async()=>{
  fx().then(r=>{if(r>0){EURX=r;render()}});
  try{const L=await live();ROWS=L.rows;NOW=L.now;SRC='live';LIVE={src:L.src,fng:L.fng};
    // Backtest: la instantánea cubre desde 2018 y los datos en directo, las semanas recientes
    HIST=[...SNAP.filter(r=>r.t<ROWS[0].t),...ROWS]}
  catch(e){ROWS=SNAP;HIST=SNAP;NOW=SNAP.at(-1).p;SRC='snap'}
  applyLang();
  loadWallet();
})();
