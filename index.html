<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SatScope</title>
<meta name="description" content="Panel de DCA dinámico para Bitcoin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%82%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: panel de una columna — acción de la semana arriba, indicadores, histórico de puntuación, ajustes plegados */
:root{
  --bg:#f6f5f1;--panel:#ffffff;--fg:#1d1c19;--muted:#6d6a60;--line:#e2dfd5;
  --accent:#d9820b;--buy:#2f7d4f;--hold:#8a8577;--sell:#b23b2e;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--panel:#1f1d17;--fg:#ece8dc;--muted:#9d998c;--line:#34312a;--accent:#f0a030;--buy:#5cbf84;--hold:#a19c8e;--sell:#e2705f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15140f;--panel:#1f1d17;--fg:#ece8dc;--muted:#9d998c;--line:#34312a;--accent:#f0a030;--buy:#5cbf84;--hold:#a19c8e;--sell:#e2705f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:1.3rem;margin:0}
h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.src{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.score{font-family:var(--mono);font-size:4rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;color:var(--muted);font-weight:400}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:.85rem;color:#fff}
.action{font-size:1.15rem;font-weight:600;margin-top:6px}
.sub{color:var(--muted);font-size:.85rem}
.bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--buy),var(--hold) 50%,var(--sell));margin:18px 0 4px}
.bar i{position:absolute;top:-5px;width:4px;height:20px;background:var(--fg);border-radius:2px;transform:translateX(-2px)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.ind{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:4px}
.ind .n{font-size:.78rem;color:var(--muted)}
.ind .v{font-family:var(--mono);font-size:1.05rem;font-weight:600}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mini b{display:block;height:100%;background:var(--accent)}
canvas{width:100%;height:180px;display:block}
details summary{cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
label{display:grid;gap:4px;font-size:.8rem}
input{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:.75rem;color:var(--muted)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:2px}
.seg button{font:inherit;font-size:.75rem;border:0;background:none;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:420px){.hero{grid-template-columns:1fr}.score{font-size:3.2rem}}
</style>
<script>
// Aplica el tema guardado antes de pintar para evitar el parpadeo
try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>SatScope</h1><span class="src" id="src">…</span></div>
    <div class="ctrls">
      <div class="seg" role="group" id="langSeg" aria-label="Idioma / Language">
        <button type="button" data-lang="es" lang="es">ES</button><button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <div class="seg" role="group" id="themeSeg" data-i18n-aria="theme">
        <button type="button" data-theme-opt="auto" data-i18n="tAuto"></button><button type="button" data-theme-opt="light" data-i18n="tLight"></button><button type="button" data-theme-opt="dark" data-i18n="tDark"></button>
      </div>
    </div>
  </div>

  <section>
    <div class="hero">
      <div class="score" id="score">–<small>/100</small></div>
      <div>
        <span class="pill" id="pill">–</span>
        <div class="action" id="action" data-i18n="calc"></div>
        <div class="sub" id="price"></div>
      </div>
    </div>
    <div class="bar"><i id="mark" style="left:50%"></i></div>
    <div class="ticks"><span data-i18n="tick0"></span><span>20</span><span>40</span><span>60</span><span>80</span><span data-i18n="tick100"></span></div>
  </section>

  <section>
    <h2 data-i18n="inds"></h2>
    <div class="inds" id="inds"></div>
  </section>

  <section>
    <h2 data-i18n="hist"></h2>
    <canvas id="chart"></canvas>
    <p class="note" data-i18n="histNote"></p>
  </section>

  <section>
    <details>
      <summary data-i18n="settings"></summary>
      <div class="grid2">
        <label><span data-i18n="lBase"></span><input type="number" id="base" value="5" min="0" step="0.5"></label>
        <label><span data-i18n="lWF"></span><input type="number" id="wF" value="30"></label>
        <label><span data-i18n="lWD"></span><input type="number" id="wD" value="40"></label>
        <label><span data-i18n="lWW"></span><input type="number" id="wW" value="15"></label>
        <label><span data-i18n="lWR"></span><input type="number" id="wR" value="15"></label>
        <label>Mult. 0–20<input type="number" id="m0" value="5" step="0.25"></label>
        <label>Mult. 20–40<input type="number" id="m1" value="1" step="0.25"></label>
        <label>Mult. 40–60<input type="number" id="m2" value="0" step="0.25"></label>
        <label>Mult. 60–80<input type="number" id="m3" value="0" step="0.25"></label>
        <label>Mult. 80–100<input type="number" id="m4" value="0" step="0.25"></label>
        <label><span data-i18n="lSellAt"></span><input type="number" id="sellAt" value="75"></label>
        <label><span data-i18n="lSellPct"></span><input type="number" id="sellPct" value="5"></label>
      </div>
      <p class="note" style="margin-top:10px" data-i18n="saved"></p>
    </details>
  </section>
  <p class="note" data-i18n="disclaimer"></p>
</div>

function applyLang(){
  const t=T();document.documentElement.lang=LANG;
  document.querySelector('meta[name="description"]').content=t.desc;

}
$('langSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.lang;try{localStorage.setItem('lang',LANG)}catch(_){}applyLang()});

// Tema
function applyTheme(th){
  if(th==='light'||th==='dark')document.documentElement.dataset.theme=th;else delete document.documentElement.dataset.theme;
  document.querySelectorAll('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeOpt===(th||'auto')));
  render();
}

function parts(r){return{f:r.fng,d:clamp((1-r.dd/80)*100),w:clamp(Math.log(r.w200)/Math.log(5)*100),r:r.rsi}}
function score(r,c){const p=parts(r);const L=[[p.f,c.wF],[p.d,c.wD],[p.w,c.wW],[p.r,c.wR]].filter(x=>x[0]!=null&&x[1]>0);let a=0,b=0;for(const[v,w]of L){a+=v*w;b+=w}return b?a/b:null}

// Datos en directo: Binance (precio diario) + alternative.me (Fear & Greed)
async function live(){
  const k=[];let end=Date.now();
  for(let n=0;n<3;n++){
    const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000&endTime=${end}`);
    if(!r.ok)throw new Error('binance');const a=await r.json();if(!a.length)break;
    k.unshift(...a);end=a[0][0]-1;
  }
  const f=await (await fetch('https://api.alternative.me/fng/?limit=730')).json();
  const fm=new Map(f.data.map(x=>[new Date(+x.timestamp*1000).toISOString().slice(0,10),+x.value]));
  const t=k.map(x=>new Date(x[0]).toISOString().slice(0,10)),p=k.map(x=>+x[4]);
  const n=p.length;const pre=[0];for(const v of p)pre.push(pre.at(-1)+v);
  const ma=(i,len)=>i>=len-1?(pre[i+1]-pre[i+1-len])/len:null;
  // Máximo histórico: Binance empieza en 2017; antes de esa fecha el ATH era menor, así que vale
  const ath=[];let m=0;for(const v of p){m=Math.max(m,v);ath.push(m)}
  const rows=[];
  for(let i=n-1;i>=0&&rows.length<105;i-=7){
    if(i<1400)break;
    let g=0,l=0;for(let j=14;j>=1;j--){const d=p[i-7*(j-1)]-p[i-7*j];if(d>0)g+=d;else l-=d}
    rows.unshift({t:t[i],p:p[i],w200:p[i]/ma(i,1400),rsi:l===0?100:100-100/(1+g/l),fng:fm.get(t[i])??null,dd:(1-p[i]/ath[i])*100});
  }
  if(rows.length<10)throw new Error('pocos datos');
  if(rows.at(-1).fng==null)rows.at(-1).fng=+f.data[0].value;
  return rows;
}

let ROWS=null;
function render(){
  if(!ROWS)return;const c=cfg();
  try{localStorage.setItem('dcaCfg',JSON.stringify(c))}catch(e){}
  const r=ROWS.at(-1),sc=score(r,c),p=parts(r);
  const band=Math.min(4,Math.floor(sc/20)),mult=c['m'+band],sell=sc>=c.sellAt;
  $('score').innerHTML=`${fmt(sc)}<small>/100</small>`;
  $('mark').style.left=sc+'%';
  const pill=$('pill'),t=T();
  if(sell){pill.textContent=t.sell;pill.style.background='var(--sell)';$('action').textContent=t.aSell(fmt(c.sellPct))}
  else if(mult>0){pill.textContent=t.buy;pill.style.background='var(--buy)';$('action').textContent=t.aBuy(fmt(c.base*mult,2),fmt(mult,2))}
  else{pill.textContent=t.hold;pill.style.background='var(--hold)';$('action').textContent=t.aHold}
  $('price').textContent=t.price(fmt(r.p),r.t);
  const I=[[t.iF,fmt(r.fng??0),p.f,c.wF],[t.iD,'−'+fmt(r.dd)+(LANG==='es'?' %':'%'),p.d,c.wD],[t.iW,fmt(r.w200,2)+'×',p.w,c.wW],[t.iR,fmt(r.rsi),p.r,c.wR]];
  $('inds').innerHTML=I.map(([n,v,s,w])=>`<div class="ind"><span class="n">${n} · ${t.weight} ${fmt(w)}</span><span class="v">${v}</span><div class="mini"><b style="width:${s??0}%"></b></div><span class="n">${t.adds} ${s==null?'–':fmt(s)} / 100</span></div>`).join('');
  draw(ROWS.slice(-104).map(x=>score(x,c)),c);
}
function draw(s,c){
  const cv=$('chart'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
  const L=28,R=6,T=6,B=6,w=W-L-R,h=H-T-B,x=i=>L+i/(s.length-1)*w,y=v=>T+h-v/100*h;
  let buyTop=0;for(let k=0;k<5;k++)if(c['m'+k]>0)buyTop=(k+1)*20;
  g.globalAlpha=.12;g.fillStyle=col('--buy');g.fillRect(L,y(buyTop),w,y(0)-y(buyTop));g.globalAlpha=1;
  g.font='10px IBM Plex Mono, monospace';g.fillStyle=col('--muted');g.strokeStyle=col('--line');g.lineWidth=1;g.textAlign='right';
  for(const v of[0,50,100]){g.beginPath();g.moveTo(L,y(v));g.lineTo(L+w,y(v));g.stroke();g.fillText(v,L-4,y(v)+3)}
  g.setLineDash([4,4]);g.strokeStyle=col('--sell');g.beginPath();g.moveTo(L,y(c.sellAt));g.lineTo(L+w,y(c.sellAt));g.stroke();g.setLineDash([]);
  g.strokeStyle=col('--accent');g.lineWidth=2;g.beginPath();s.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.stroke();
  g.fillStyle=col('--accent');g.beginPath();g.arc(x(s.length-1),y(s.at(-1)),4,0,7);g.fill();
}
